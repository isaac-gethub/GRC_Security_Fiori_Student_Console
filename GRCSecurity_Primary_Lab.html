<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAP GRC / Security Primary Lab — Calder Ridge Manufacturing</title>
<style>
  :root {
    --navy: #1F3864;
    --navy-deep: #142545;
    --gold: #9C7A22;
    --gold-light: #C79A3D;
    --paper: #FAF9F6;
    --panel: #FFFFFF;
    --ink: #1D1D1B;
    --ink-soft: #55524C;
    --line: #DAD5C8;
    --callout: #F2F0E8;
    --model: #EAF0EA;
    --gate: #2A2320;
    --gate-ink: #F1EADD;
    --ok: #3E6B4F;
    --radius: 3px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.55;
  }
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }

  /* ---------- Shell ---------- */
  .shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: 300px; flex-shrink: 0;
    background: var(--navy-deep);
    color: #E9E4D8;
    padding: 28px 0 40px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { padding: 0 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.12); }
  .brand .kicker { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; letter-spacing: 0.06em; color: var(--gold-light); margin: 0 0 6px; }
  .brand h1 { font-size: 21px; margin: 0 0 4px; line-height: 1.25; font-weight: 600; }
  .brand p { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12.5px; color: #B9B2A0; margin: 0; }

  .progress-block { padding: 18px 24px; border-bottom: 1px solid rgba(255,255,255,0.12); font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  .progress-block .label { font-size: 12px; color: #B9B2A0; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .progress-track { height: 6px; background: rgba(255,255,255,0.14); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-light)); transition: width 0.4s ease; }

  .lab-nav { list-style: none; margin: 0; padding: 10px 12px; }
  .lab-nav li { margin-bottom: 2px; }
  .lab-nav button {
    width: 100%; text-align: left; background: none; border: none; color: #D9D3C4;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13.5px;
    padding: 11px 12px; border-radius: var(--radius); cursor: pointer; display: flex; align-items: center; gap: 10px;
  }
  .lab-nav button:hover { background: rgba(255,255,255,0.06); }
  .lab-nav button.active { background: rgba(255,255,255,0.11); color: #fff; }
  .lab-nav .num { font-weight: 700; color: var(--gold-light); width: 20px; flex-shrink: 0; }
  .lab-nav .dom { flex: 1; }
  .lab-nav .check { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #6b6656; flex-shrink: 0; }
  .lab-nav button.done .check { background: var(--gold-light); border-color: var(--gold-light); }

  .footer-link { padding: 16px 24px 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  .footer-link a { color: #D9D3C4; font-size: 12.5px; text-decoration: none; border-bottom: 1px dotted #6b6656; }
  .footer-link a:hover { color: #fff; }
  .sync-status { margin-top: 10px; font-size: 11.5px; color: #8b8878; }
  .sync-status.on { color: var(--gold-light); }

  /* ---------- Main content ---------- */
  .main { flex: 1; padding: 48px 56px 100px; max-width: 900px; }
  .rules-banner {
    display: flex; gap: 20px; background: var(--gate); color: var(--gate-ink);
    padding: 14px 20px; border-radius: var(--radius); margin-bottom: 36px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12.5px; flex-wrap: wrap;
  }
  .rules-banner div { flex: 1; min-width: 220px; }
  .rules-banner b { color: var(--gold-light); }

  .lab-header .eyebrow { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12.5px; color: var(--ink-soft); margin: 0 0 6px; }
  .lab-header h2 { font-size: 30px; margin: 0 0 4px; color: var(--navy); line-height: 1.2; }
  .lab-header .companion { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12.5px; color: var(--ink-soft); font-style: italic; margin-bottom: 34px; }

  .field { margin-bottom: 30px; }
  .field h3 {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 13.5px; text-transform: none; color: var(--navy);
    border-bottom: 2px solid var(--line); padding-bottom: 6px; margin: 0 0 10px;
    display: flex; align-items: baseline; gap: 8px;
  }
  .field h3 .fn { color: var(--gold); font-weight: 700; }
  .field p { margin: 0 0 10px; font-size: 16px; }

  .exec-part { margin: 18px 0 22px; padding-left: 18px; border-left: 3px solid var(--line); }
  .exec-part h4 { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14.5px; color: var(--gold); margin: 0 0 8px; }
  .exec-part .before { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13.5px; font-style: italic; color: var(--ink-soft); margin-bottom: 10px; }
  .exec-part ol { margin: 0 0 10px; padding-left: 22px; }
  .exec-part li { margin-bottom: 8px; font-size: 15.5px; }
  .exec-part li label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  .exec-part li input[type=checkbox] { margin-top: 5px; flex-shrink: 0; }
  .exec-part li span.done-text { text-decoration: line-through; color: #8b8878; }
  .capture { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; color: var(--ink-soft); background: var(--callout); padding: 8px 12px; border-radius: var(--radius); }
  .capture b { color: var(--ink); }

  .callout {
    background: var(--callout); border-left: 4px solid var(--gold);
    padding: 14px 18px; border-radius: var(--radius); margin: 8px 0 20px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13.5px; color: var(--ink);
  }
  .callout b { display: block; color: var(--navy); margin-bottom: 4px; font-size: 12.5px; letter-spacing: 0.02em; }

  textarea {
    width: 100%; min-height: 110px; font-family: Georgia, serif; font-size: 15.5px;
    border: 1.5px solid var(--line); border-radius: var(--radius); padding: 12px 14px;
    resize: vertical; background: var(--panel); color: var(--ink);
  }
  textarea:focus { outline: none; border-color: var(--navy); }

  .reveal-btn, .gate-btn, .action-btn {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600;
    background: var(--navy); color: #fff; border: none; padding: 9px 18px;
    border-radius: var(--radius); cursor: pointer; margin-top: 10px;
  }
  .reveal-btn:hover, .gate-btn:hover, .action-btn:hover { background: var(--navy-deep); }
  .reveal-btn:disabled { background: #C9C4B6; cursor: not-allowed; }

  .model-box {
    display: none; margin-top: 12px; background: var(--model); border-left: 4px solid var(--ok);
    padding: 14px 18px; border-radius: var(--radius);
  }
  .model-box.shown { display: block; }
  .model-box .tag { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11.5px; font-weight: 700; color: var(--ok); letter-spacing: 0.04em; margin-bottom: 6px; }
  .model-box p { margin: 0; font-size: 15.5px; }

  .challenge-quote {
    font-size: 18px; font-style: italic; color: var(--navy); border-left: 4px solid var(--navy);
    padding: 4px 0 4px 18px; margin: 6px 0 14px;
  }

  .gate-section {
    margin-top: 40px; background: var(--gate); color: var(--gate-ink);
    padding: 22px 24px; border-radius: var(--radius);
  }
  .gate-section .warn { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; color: var(--gold-light); margin-bottom: 10px; }
  .gate-section .gq { font-size: 17px; font-style: italic; margin-bottom: 12px; }
  .gate-section textarea { background: #3A322D; border-color: #574C41; color: var(--gate-ink); }
  .gate-section .model-box { background: #33392E; border-left-color: var(--gold-light); }
  .gate-section .model-box .tag { color: var(--gold-light); }
  details.gate-toggle summary { cursor: pointer; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12.5px; color: var(--gold-light); margin-bottom: 14px; }

  .complete-row { display: flex; align-items: center; justify-content: space-between; margin-top: 44px; padding-top: 24px; border-top: 1px solid var(--line); }
  .complete-row .status { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; color: var(--ink-soft); }
  .complete-row .status.done { color: var(--ok); font-weight: 600; }

  @media (max-width: 880px) {
    .shell { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: relative; padding-bottom: 10px; }
    .main { padding: 32px 20px 80px; }
    .lab-header h2 { font-size: 24px; }
  }
  @media (max-width: 600px) {
    .rules-banner { flex-direction: column; gap: 10px; }
    .field p, .exec-part li { font-size: 15px; }
  }
</style>
</head>

<script>
const LABS = [{"lab": 1, "book": "The Ruleset That Went Quiet", "domain": "Access Risk Analysis / SoD Ruleset Design", "ticket": "The Controls team's quarterly SoD monitoring report flags something odd: a ruleset that used to catch violations regularly has shown near-zero hits for three straight quarters. They open a ticket asking Security to confirm the ruleset is still doing its job — the pattern happens to line up with a Fiori rollout eighteen months ago that retired several classic transaction codes.", "process": "Procure-to-pay staff create and maintain vendor master records and post vendor payments. The SoD rule in question exists to flag any single user able to perform both.", "impact": "A user with both vendor-master and payment-posting access could create a fictitious or altered vendor and pay it without independent detection — and the ruleset's outdated function scope means that access combination is no longer being watched for at all.", "objective": "Ensure the SoD ruleset's function definitions reflect the transaction codes and Fiori apps the business actually executes today, so real access conflicts in procure-to-pay are detected rather than silently missed.", "design": "A GRC Access Control ruleset defines each function's action list (transaction codes / Fiori app IDs). When the business's execution layer changes, the function definitions must be updated in lockstep, or the rule stops watching the real risk while still appearing to exist.", "scope": "All function IDs within the procure-to-pay risk category whose action lists reference transaction codes retired or superseded in the last Fiori rollout.", "scope_source": "GRC Access Control's function maintenance configuration (SPRO > GRC > Access Control > Maintain Functions), cross-referenced against the Fiori app-to-backend-transaction mapping list from the rollout project.", "scope_check": "Reconcile your exported function list count against the ruleset's total function count in the GRC configuration UI, and confirm the Fiori mapping list you're cross-referencing is the final rollout version, not an interim draft — an outdated mapping list will make a correctly-updated function look wrong.", "fix_approach": "Fix every flagged function definition in the procure-to-pay risk category, not just the one that triggered the ticket — a single missed function can leave an entire class of access conflict undetected.", "verification": "Before/after screenshots of each corrected function's action list, the training-ruleset risk analysis rerun showing the newly surfaced conflicts, and a mapping table tying the old transaction codes to their Fiori/backend replacements — attach these to the ticket when you close it.", "exec": [{"title": "Part A — Run the Baseline Risk Analysis", "before": "Confirm you are in the designated training client, signed in with your assigned training user ID.", "steps": ["Access GRAC_SPM (or the Access Risk Analysis Fiori app).", "Run a risk analysis for the procure-to-pay risk category, scoped to all users.", "Export the result set and note the total violation count."], "capture": "Risk analysis run date/time, total violation count, risk ID(s) reviewed."}, {"title": "Part B — Trace a Function's Action List", "before": "Have the current Fiori-to-backend transaction mapping list open for reference.", "steps": ["Navigate to the Maintain Functions configuration for the flagged risk's function IDs.", "Open each function's action list and record every transaction code / Fiori app ID currently included.", "Cross-check each entry against the mapping list to identify retired codes with no listed replacement."], "capture": "Function ID, current action list, any retired codes found, their correct replacement app ID."}, {"title": "Part C — Update the Function and Retest (Practice Namespace)", "before": "Confirm the practice ruleset copy assigned to you (prefixed ZZ_TRAIN_) is the one you are editing — never the live ruleset.", "steps": ["In your training ruleset copy, add the correct current Fiori app ID / backend transaction to the affected function's action list.", "Save and generate the updated rule.", "Rerun the risk analysis against the same user set using the training ruleset.", "Compare the new violation count against Part A's baseline."], "capture": "Before/after violation counts, screenshot of the corrected function definition, names of any newly surfaced conflicted users."}], "evaluation": "A properly corrected function should surface conflicts that existed all along but were invisible to the outdated rule. If the count doesn't change at all after correction, re-check that the correct app ID was actually added and saved to the training ruleset.", "resolution": "Root cause: the ruleset's function definitions were never updated after the Fiori rollout, so a real, ongoing SoD conflict in procure-to-pay had gone undetected for over a year. Fix: updated the function's action list to include the current Fiori app IDs, which restored the rule's ability to detect the conflict it was originally built for.", "pushback": "The business risk owner signed off on the original ruleset scope. Doesn't that cover this too?", "pushback_model": "A scope sign-off reflects the transaction landscape at the time it was approved — it doesn't anticipate every later change to how the business executes its processes. When something material changes the execution layer, like a Fiori migration retiring transaction codes, the ruleset config needs to be revisited regardless of how firmly the original scope was signed off.", "escalation": "If updating this function's action list makes the violation count jump from near-zero to double digits overnight, how do you explain that to the client without it sounding like Security just created a new problem?", "escalation_model": "Frame it as detection catching up to reality, not a new risk being introduced — the conflicts existed the whole time; the fix just made them visible again. Lead with the scope and the verification evidence (how many users, what access, how long it went undetected), not with blame toward whoever built the original ruleset, and bring a remediation plan to the same conversation as the finding."}, {"lab": 2, "book": "The Shared Login", "domain": "Emergency Access Management (Firefighter)", "ticket": "Ahead of the access review, the Controls team opens a ticket: three months of Firefighter log reports all show \"reviewed\" — but the reviewer field is the same controller for every entry, including six weeks he was out on leave.", "process": "Firefighter ID FF_FI_02 is used during month-end close by whoever on the finance team happens to be handling it that cycle, rather than a single named individual.", "impact": "Shared use of a Firefighter ID breaks individual accountability — if something goes wrong during a session, there is no reliable way to determine who actually performed it, and a reviewed-but-not-actually-reviewed log gives false assurance that nothing did.", "objective": "Confirm that Firefighter sessions map to a single identifiable individual, and that log reviews are evidenced, independent, and actually performed by someone who was available to perform them.", "design": "Each Firefighter ID assignment should be individual and time-bound; each session's log should be reviewed by a designated reviewer within a defined window, with documented evidence of that review distinct from a status flag.", "scope": "All Firefighter sessions on FF_FI_02 (and any other shared-use IDs identified) over the backlog period, plus the corresponding review records.", "scope_source": "GRAC_SPM Firefighter Log Report for the assignment and session history; badge/VPN access logs and leave/calendar records as independent corroboration.", "scope_check": "Confirm the log report's session count for the period matches the raw system log table count for that Firefighter ID — a filtered or date-truncated export will understate what you're actually dealing with.", "fix_approach": "Work the full backlog period, not a slice of it — then pull a targeted follow-up on any session with no corroborating badge/VPN match for deeper investigation.", "verification": "Log report export, badge/VPN reconciliation worksheet showing matched and unmatched sessions, and the corrected review-evidence template once you've redesigned it — attach these when you close the ticket.", "exec": [{"title": "Part A — Pull the Log Report and Reviewer Field", "before": "Identify the Firefighter ID(s) and date range in scope before opening the report.", "steps": ["Run the Firefighter Log Report for FF_FI_02 over the backlog period.", "Record the reviewer field and review-status flag for each session.", "Cross-check the reviewer's leave/calendar record for the review dates shown."], "capture": "Session list, reviewer per session, any sessions reviewed during the reviewer's confirmed leave."}, {"title": "Part B — Reconcile Sessions to People", "before": "Have badge or VPN log access ready; this step is a manual reperformance and will take longer than a report pull.", "steps": ["For each session, identify the login timestamp and duration.", "Match the timestamp against badge/VPN records to identify who was physically or remotely present.", "Flag any session with no matching individual record."], "capture": "Matched sessions with identified individual, unmatched sessions requiring follow-up."}, {"title": "Part C — Configure Individual Assignment and Expedited Approval (Training Namespace)", "before": "Work in your assigned training EAM configuration copy, not the live Firefighter ID assignment.", "steps": ["Build an individual Firefighter assignment for a named test user in the training configuration.", "Configure an expedited MSMP approval path for that assignment type with a same-day service level.", "Simulate a month-end request end to end and confirm it resolves to one named individual with a timestamped approval."], "capture": "Screenshot of the individual assignment, the expedited approval path configuration, and the completed test request."}], "evaluation": "If sessions remain unmatched to any individual after reconciliation, treat that as a control gap requiring escalation, not an inconclusive result to set aside.", "resolution": "Root cause: Firefighter ID FF_FI_02 was shared across multiple users, and its log reviews were being marked complete by a reviewer who was on leave for part of the period — so neither individual accountability nor an actual review was happening, despite the system showing both as satisfied. Fix: configured individual, time-bound Firefighter assignment with an expedited approval path so month-end doesn't need a shared login to stay on schedule.", "pushback": "If everyone has to wait for individual Firefighter provisioning, month-end doesn't close on schedule. Isn't that a real problem too?", "pushback_model": "It is a real problem, and dismissing it will lose the room. This isn't a choice between speed and accountability — Part C builds an approval path fast enough to meet the business need while keeping each assignment individual, which is exactly what makes both possible at once.", "escalation": "The team lead whose staff used the shared login isn't hiding anything and is embarrassed once this surfaces. How do you raise it without it landing as an accusation?", "escalation_model": "Separate the issue from the person: the issue is the shared-use pattern and the review gap, not anyone's individual judgment. Acknowledge the real scheduling pressure that led to the workaround, and bring the fix (the expedited path) to the same conversation as the problem, not as an afterthought."}, {"lab": 3, "book": "The Split That Closed a Door", "domain": "Business Role Design & PFCG", "ticket": "AP opens a ticket Monday morning: since Friday's weekend go-live split a composite role in two, they can no longer complete a routine step in their three-way match — one that has nothing to do with the SoD conflict the split was meant to close.", "process": "AP staff perform a three-way match step that touches both a vendor-side field and a payment-side transaction on the same screen — a legitimate task that doesn't itself create an SoD conflict.", "impact": "Splitting a role along transaction-code lines rather than authorization-object lines can either leave a shared object creating a new conflict, or remove an object needed for a legitimate task that happened to share ground with the removed access.", "objective": "Restore the severed legitimate access without recreating the original SoD conflict the split was designed to close.", "design": "Role splits should be scoped at the authorization-object and field-value level, verified against both the conflict being closed and every legitimate task the affected users still need to perform.", "scope": "The two split roles (vendor maintenance and payment posting), their full authorization object lists, and the specific field-level values in each.", "scope_source": "PFCG role authorization data for both roles (via the role's authorization tab or a SUIM authorization-object report), compared against the original composite role's authorization data as a baseline.", "scope_check": "Confirm the authorization object list you pulled for each role includes everything, not just what was added or changed during the split — an incremental change log will miss inherited objects.", "fix_approach": "Compare every authorization object in both split roles against the original composite role — this isn't something you can spot-check, since the missing object could be anywhere in the list.", "verification": "Side-by-side authorization object comparison, the specific object and field values causing the gap, and test results confirming the corrected role restores the task without reopening the SoD conflict.", "exec": [{"title": "Part A — Compare Composite vs. Split Role Authorizations", "before": "Have the original composite role's authorization data exported before it's decommissioned or hard to retrieve.", "steps": ["Export the full authorization object list, with field values, for the original composite role.", "Export the same for both resulting split roles.", "Line up all three side by side to identify what each split role kept, dropped, or shares."], "capture": "Full three-way authorization object comparison table."}, {"title": "Part B — Identify the Missing Non-Conflicting Object", "before": "Know the exact SoD conflict definition (which two authorizations together create the risk) before starting this step.", "steps": ["From the comparison, identify the object(s) present in the composite role but missing from both split roles.", "Confirm this object is not one of the two authorizations that create the original SoD conflict.", "Document the object and field values needed to restore the legitimate task."], "capture": "The specific authorization object and field values required, with confirmation it does not overlap the SoD conflict definition."}, {"title": "Part C — Rebuild the Role and Retest (Training Namespace)", "before": "Work in your assigned ZZ_TRAIN_ copy of the affected role, not the production role.", "steps": ["Add the missing authorization object and field values to your training copy of the vendor-maintenance role.", "Save and generate the role.", "Run a risk analysis against the corrected role combination to confirm the original SoD conflict does not reappear.", "Have a business tester (or simulated test script) execute the three-way match step against the corrected role."], "capture": "Confirmation the SoD conflict stays closed, and confirmation the three-way match step now completes successfully."}], "evaluation": "A correct fix restores the specific legitimate task without any change to the SoD risk analysis result. If the risk analysis result changes at all after your fix, you've likely restored more than the one missing object.", "resolution": "Root cause: the original split was scoped along transaction-code lines instead of authorization-object lines, which left a legitimate cross-functional task without an object it needed — even though that object had nothing to do with the actual SoD conflict. Fix: restored the specific missing authorization object to close the gap without reopening the conflict.", "pushback": "You fixed one thing and broke my process. How do I know the next fix won't break something else?", "pushback_model": "Because this fix was verified two ways: a risk analysis rerun confirming the SoD conflict stays closed, and a business tester actually executing the affected task before sign-off — not just consultant sign-off alone. That two-step verification should go with every role change from here, not just this one.", "escalation": "The business wants this live today. Proper testing takes until tomorrow. How do you handle that conversation?", "escalation_model": "Name the trade-off directly instead of absorbing the pressure quietly: a same-day fix without business testing carries the same risk that caused this incident in the first place. Offer the fastest path that still includes a business tester's confirmation, even if it costs a few hours, and let the business decide with the trade-off stated plainly."}, {"lab": 4, "book": "The Approval Nobody Sent", "domain": "MSMP Workflow (GRC Access Control)", "ticket": "Controls opens a ticket after noticing every single access request in the last eighteen months shows as approved — zero rejections, no exceptions — and asks Security to check whether the workflow is actually working.", "process": "Access requests route through an MSMP workflow stage to a designated approver; if the approver doesn't act within 48 hours, the request is meant to escalate.", "impact": "If the escalation path resolves an unanswered request as approved by default rather than escalating to another human, an access-approval control that looks fully operating is, in substance, granting access with no actual review at all.", "objective": "Confirm that access requests are resolved by an actual approver decision, and that any timeout path escalates to a person rather than defaulting to approval.", "design": "MSMP workflow stages use agent determination and BRF+ rules to route requests and handle non-response; a properly designed timeout path escalates to a named backup approver, and eventually to their manager, without ever auto-resolving to approved.", "scope": "All access requests over the review period, categorized by resolution type: approved by a named approver's action, versus resolved via a timeout/fallback path.", "scope_source": "The MSMP workflow log table (or GRC AC's request history with resolution-type detail), queried directly rather than relying on the workflow's own summary status field.", "scope_check": "Confirm your query covers the full period and every workflow template in use, not just the primary access-request template — other request types can carry their own fallback behavior.", "fix_approach": "Check the resolution-type breakdown for the full set of requests first, then pull a sample of timeout-resolved ones and reperform them against the actual configuration to see exactly how the fallback behaves.", "verification": "The resolution-type query output, the workflow stage configuration showing the fallback rule, and a training-environment test proving the redesigned escalation chain never auto-approves.", "exec": [{"title": "Part A — Query Resolution Types", "before": "Get read access to the workflow log table or its GRC AC reporting equivalent before starting.", "steps": ["Query the workflow log for all access requests in the review period.", "Categorize each by resolution type: explicit approver action vs. timeout/fallback resolution.", "Calculate what percentage of the total was resolved via fallback rather than a human decision."], "capture": "Resolution-type breakdown and the fallback percentage."}, {"title": "Part B — Trace the Stage Configuration", "before": "Identify which specific workflow stage and template is generating the fallback behavior before opening configuration.", "steps": ["Navigate to the MSMP workflow configuration for the affected stage.", "Locate the agent determination rule and its timeout/escalation setting.", "Determine exactly what happens when the timeout is reached — escalation to another approver, or automatic approval."], "capture": "Screenshot of the fallback configuration and a plain-language description of what it actually does on timeout."}, {"title": "Part C — Redesign and Test the Escalation Chain (Training Namespace)", "before": "Work in your assigned ZZ_TRAIN_ workflow configuration copy.", "steps": ["Reconfigure the stage so a 48-hour timeout escalates to a named backup approver, not an automatic approval.", "Add a second escalation tier (e.g., to the backup approver's manager) for a further timeout.", "Submit a test request and deliberately do not respond at each stage to confirm it escalates correctly and never resolves to approved on its own."], "capture": "Test request results at each timeout stage, confirming escalation and no auto-approval outcome."}], "evaluation": "A correctly redesigned workflow should show the test request still pending or escalated at every timeout point — if it ever shows approved without a corresponding approver action in the log, the fallback has not been fully removed.", "resolution": "Root cause: the workflow's timeout path had been configured to auto-approve rather than escalate, which quietly turned an approval control into something that resolved every unanswered request as if someone had reviewed it. Fix: reconfigured the timeout to escalate to a named backup approver, then their manager, with no path that ever resolves to approved on its own.", "pushback": "The alternative was requests sitting for two weeks because approvers don't check their queue. Wasn't the fallback solving a real problem?", "pushback_model": "The underlying problem — slow approver response — was real and worth solving. The fallback solved it by removing the review entirely rather than making it faster; escalating to a second person, as the redesign does, fixes the same speed problem without cutting the review it depends on.", "escalation": "Whoever configured this fallback did it to relieve a genuine business pain point, with no sign-off on file. How do you write this up without it reading as an accusation?", "escalation_model": "Write up the effect on the control, not the intent behind the change: a configuration change that converted an approval control into a de facto no-review path matters regardless of why it was made. Say plainly that the change looks well-intentioned, then separately note that config changes to anything approval-related still need to go through change management."}, {"lab": 5, "book": "Copied From Someone Else", "domain": "Access Control Provisioning", "ticket": "HR flags a new hire whose access looks broader than the job justifies. Tracing it back, the request used a fast-track \"copy from reference user\" shortcut — and the reference user had moved to a different role eight months earlier, so their access at copy-time was already out of date.", "process": "New hires are commonly provisioned by copying an existing user's role assignments onto the new request rather than building the role list item by item.", "impact": "If the reference user's own access has drifted since their profile was last correct, every new hire copied from them inherits that drift — potentially including access combinations that would fail a current SoD check.", "objective": "Confirm that reference-user-based provisioning validates the reference user's own current access before copying it forward, and remediate any new hires who inherited inappropriate access.", "design": "The Access Request form's reference-user feature should trigger an automatic SoD validation against the reference user's current access at the moment of copying, not assume the reference user's profile is still correct.", "scope": "All new-hire access requests over a defined period that used the reference-user copy feature, and the current access profile of each reference user involved.", "scope_source": "Access Request Management history filtered for requests using the reference-user field; each reference user's current role assignments pulled via SUIM or the GRC user access report.", "scope_check": "Confirm your request-history filter catches every request type that supports reference-user copying, not just the standard new-hire template — some request types allow it without labeling it the same way.", "fix_approach": "Check every reference user's current access in full rather than a sample — one drifted reference user can be feeding bad access into every new hire copied from them.", "verification": "The request sample with reference users identified, each reference user's current-access SoD check result, and the corrected role builds for affected new hires with manager sign-off.", "exec": [{"title": "Part A — Pull the Reference-User Sample", "before": "Confirm your reporting access covers the Access Request Management module's full request history, not just pending requests.", "steps": ["Query recent new-hire access requests for those using the reference-user field.", "Record the reference user named on each request.", "Note the date each request was submitted and the reference user's role at that time if available."], "capture": "Sample list of requests with reference user, new hire, and request date."}, {"title": "Part B — Check Reference Users' Current Access", "before": "Run this against each unique reference user identified, not each request — a single reference user may appear on multiple requests.", "steps": ["Pull each reference user's current full role assignment list.", "Run a risk analysis against that role combination.", "Flag any reference user whose current access would not pass a fresh SoD check."], "capture": "List of reference users with SoD-flagged current access, and which new hires were copied from them."}, {"title": "Part C — Build the Validation Guardrail (Training Namespace)", "before": "Work in your assigned ZZ_TRAIN_ copy of the Access Request workflow configuration.", "steps": ["Configure a validation step that triggers an automatic SoD check against the reference user's current access whenever the reference-user field is used.", "Configure the workflow to block or flag the request for review if that check fails.", "Submit a test request using a deliberately SoD-flagged reference user and confirm the guardrail triggers correctly."], "capture": "Screenshot of the guardrail configuration and the test request result showing the block/flag behavior."}], "evaluation": "The guardrail is working correctly only if a request using a clean reference user passes through normally while one using a flagged reference user is stopped or flagged — test both cases, not just the failing one.", "resolution": "Root cause: the reference-user copy feature had no check on whether the reference user's own access was still appropriately scoped, so access drift in one person's profile was being propagated, undetected, to every new hire copied from them. Fix: added an automatic SoD validation against the reference user's current access at the moment of copying, with a block/flag on failure.", "pushback": "We built the shortcut to save time during a hiring wave. Isn't rejecting it now just going to bring back the original slowdown?", "pushback_model": "The fix doesn't reject the shortcut — it adds one automated check to it. Because the SoD validation runs automatically instead of requiring a manual role-by-role build, the speed benefit of reference-user copying stays intact for the normal case, and only the actual risk case (a drifted reference user) needs extra attention.", "escalation": "The manager who approved the original flawed requests says he didn't know what \"copy from reference user\" meant technically when he signed off. How does that change how you write this up for him?", "escalation_model": "It shifts this from an individual-accountability issue to a design and communication gap: approvers can't meaningfully review something built into a shortcut whose mechanics were never explained to them. Frame the fix around making the reference user's access visible at approval time, not around telling approvers to look more carefully."}, {"lab": 6, "book": "The Proposal Nobody Updated", "domain": "User & Role Administration / SU24 Authorization Defaults", "ticket": "A developer opens a ticket: building a role around a two-year-old custom transaction returns an almost-empty SU24 authorization default proposal. Turns out SU24 was never properly maintained when the transaction was built.", "process": "AP staff use a custom transaction to place holds on vendor payments pending investigation; roles including this transaction were each built manually, with no consistent authorization baseline to build from.", "impact": "Without a maintained SU24 proposal, every role builder guesses independently at the correct authorization objects, producing inconsistent roles — some too broad, some missing authorizations they should have, with no way to tell which from the configuration alone.", "objective": "Establish a correct, maintained SU24 default proposal for the custom transaction, and bring all existing roles containing it into alignment with that corrected baseline.", "design": "SU24 authorization default maintenance should be a required step whenever a custom transaction is built, owned jointly by the development and security teams, not left to whichever role builder encounters it first.", "scope": "All roles currently containing the custom transaction, and their full authorization object lists for comparison.", "scope_source": "SU24 tables (USOBX_C / USOBT_C) for the custom transaction; PFCG role search or SUIM report for all roles containing that transaction code.", "scope_check": "Confirm your role search catches roles where the transaction comes in through a derived or composite role, not only roles where it's assigned directly.", "fix_approach": "Compare every role containing the transaction, not a sample — the whole point is finding exactly where they diverge from each other and from a correct baseline.", "verification": "The empty/incomplete SU24 proposal screenshot, the side-by-side role authorization comparison, the corrected SU24 maintenance, and the rebuilt roles with the stray unrelated authorization removed.", "exec": [{"title": "Part A — Check SU24 Proposal Completeness", "before": "Confirm you know the exact custom transaction code in scope before starting.", "steps": ["Add the custom transaction to a test role in PFCG and observe the authorization default proposal returned.", "Check the SU24 tables directly for existing entries for this transaction.", "Determine whether the proposal is empty, partial, or simply outdated."], "capture": "Screenshot of the proposal result and the raw SU24 table entries (or absence of entries)."}, {"title": "Part B — Compare Authorization Objects Across Existing Roles", "before": "Pull the full role list containing the transaction before starting the comparison.", "steps": ["Export the full authorization object list for every role containing the custom transaction.", "Line them up side by side by job function to identify inconsistencies.", "Flag any authorization object present in one role but absent from an otherwise-similar role, and any object that appears unrelated to the transaction's actual function."], "capture": "Cross-role comparison table with flagged inconsistencies and any unrelated authorization objects found."}, {"title": "Part C — Maintain SU24 and Rebuild Roles (Training Namespace)", "before": "Work in your assigned ZZ_TRAIN_ role copies; do not edit production roles directly.", "steps": ["Define the correct authorization objects and default values for the custom transaction in your training SU24 maintenance.", "Re-add the transaction to a training copy of each affected role and accept the corrected proposal.", "Remove any unrelated authorization object identified in Part B.", "Compare the rebuilt role's authorization objects against the corrected baseline to confirm consistency."], "capture": "Corrected SU24 entries, rebuilt role authorization lists, and confirmation the unrelated object was removed."}], "evaluation": "Success means every role containing the transaction now derives from the same corrected baseline and no longer contains the unrelated authorization object — inconsistency across roles doing the same job is itself evidence the fix isn't complete yet.", "resolution": "Root cause: SU24 had never been maintained for this custom transaction, so every role builder over two years guessed independently at the correct authorizations — producing inconsistent access across people doing the same job, plus at least one authorization with no real relationship to the transaction. Fix: maintained the correct SU24 default proposal and rebuilt every affected role from that corrected baseline.", "pushback": "I'm a developer. I built what Finance asked for and tested that it worked. Why is SU24 my responsibility?", "pushback_model": "Fair question — and honestly, it shouldn't be anyone's unstated responsibility. It should be a named step in the custom-transaction release checklist, owned jointly by development and security, so the next developer isn't left guessing whether it's their job either.", "escalation": "The Basis lead is worried adding an SU24 checkpoint to the release process will slow down releases the business is already impatient about. How do you propose it without triggering that resistance?", "escalation_model": "Propose it as a parallel checklist item reviewed alongside the existing release steps, not a blocking gate everything else has to wait on — the goal is making sure it happens, not necessarily that it happens before every other step, and that framing is often what turns a stakeholder's answer from no to yes."}, {"lab": 7, "book": "Resolved on the Report", "domain": "SoD Remediation & Mitigating Controls", "ticket": "Ahead of quarter-close, Controls asks Security to spot-check a batch of SoD conflicts marked \"Mitigated\" in the GRC report. One has a named control owner attached — who turns out to have never performed the monthly review the mitigation describes, and didn't know he was expected to.", "process": "When an SoD conflict can't be remediated by changing access, a mitigating control — typically a periodic management review — is assigned instead and the finding is marked resolved in the system.", "impact": "If assigning a mitigating control in the system is treated as the end of the remediation process rather than the start of an operating control, a conflict can show as resolved indefinitely while nothing is actually reviewing it.", "objective": "Confirm that every mitigating control marked as assigned is actually operating, with real evidence, and rebuild the assignment process so future mitigations can't close without an evidence requirement attached.", "design": "A mitigating control's status should require an attached evidence template and a review cadence the control owner has acknowledged in writing, not just a name and a description entered at the time of assignment.", "scope": "All SoD conflicts currently showing status \"Mitigated,\" and the evidence (or absence of it) supporting each one.", "scope_source": "GRC Access Control's mitigated-risk report / mitigation assignment table, cross-referenced against whatever evidence repository (shared drive, ticketing system, email) the control owner is expected to use.", "scope_check": "Confirm the mitigated-risk report includes conflicts mitigated at both the role level and the user level — some GRC configurations report these separately.", "fix_approach": "Start with a working sample of mitigated conflicts (ten is a reasonable start) across different control owners and departments, and expand to the full list of mitigated conflicts if the sample shows a real pattern of gaps.", "verification": "The mitigated-risk report extract, the evidence-request correspondence with each control owner, the sample results table, and the redesigned mitigation-assignment process with its evidence template.", "exec": [{"title": "Part A — Pull the Mitigated-Risk List", "before": "Confirm the report scope covers all business processes, not just the one where the original finding was noticed.", "steps": ["Run the mitigated-risk report from GRC Access Control.", "Record the mitigation description, assignment date, and named control owner for each conflict.", "Select an initial sample of ten mitigated conflicts across different control owners and departments."], "capture": "Sample list with mitigation description, assignment date, and control owner per conflict."}, {"title": "Part B — Request Evidence From Each Control Owner", "before": "Prepare a short, specific evidence request — asking for \"the review\" without specifying the period or format tends to get an unusable answer.", "steps": ["Contact each control owner in the sample and request documented evidence of the review for a specific recent period.", "Record whether evidence was provided, and if so, whether it actually demonstrates the review described in the mitigation.", "For control owners who can't produce evidence, ask directly whether they were aware of the review responsibility at all."], "capture": "Evidence-provided vs. evidence-absent count, and control owner awareness for each absent case."}, {"title": "Part C — Build the Evidence-Requirement Template (Training Namespace)", "before": "Work in your assigned ZZ_TRAIN_ mitigation-assignment configuration or template library.", "steps": ["Design an evidence template specifying what documentation a mitigating control review must produce and how often.", "Configure the mitigation assignment process so a \"Mitigated\" status cannot be saved without the control owner acknowledging the evidence template and cadence in writing.", "Test the new process end to end with a sample mitigation assignment."], "capture": "The evidence template, the configured acknowledgment step, and the completed test assignment showing the requirement enforced."}], "evaluation": "If the sample shows even one mitigation without real evidence, treat it as indicating a systemic gap worth expanding the sample for — a single missing review is a finding; a pattern across control owners is a process design failure.", "resolution": "Root cause: mitigating controls were being marked assigned and closed in the system with no mechanism requiring the control owner to actually perform or evidence the review — so a meaningful share of \"resolved\" conflicts had no real control operating behind them at all. Fix: redesigned the mitigation-assignment process so a \"Mitigated\" status can't be saved without the control owner acknowledging an evidence template and review cadence in writing.", "pushback": "I assigned the mitigating control and the system marked the finding closed. Wasn't that the correct process at the time?", "pushback_model": "It followed the process as it existed — which is exactly why the process needs to change, rather than treating this as one person's oversight. Assigning a control in the system should be the start of an operating control's evidence trail, not the definition of it being done.", "escalation": "The CFO wants to know how many other \"resolved\" findings across the whole GRC system might have the same problem. What do you tell him before you've checked every mitigated conflict?", "escalation_model": "Give him the honest, bounded answer: the sample tested showed a specific failure rate, which is a reasonable basis for concern but not yet a company-wide number — checking every mitigated conflict is the next step to get a defensible answer instead of an extrapolated guess."}, {"lab": 8, "book": "The Tile That Opened Everything", "domain": "Fiori Catalog & Space Security", "ticket": "An AP clerk submits a ticket: she can see a \"Mass Vendor Change\" tile on her Fiori Launchpad that she's never used and doesn't think she should have. Tracing it back reveals the backend access underneath is far broader than the tile itself suggests.", "process": "Fiori Launchpad content is organized into spaces, each tied to a business catalog and, through that, a PFCG role; last year's rollout grouped catalogs into a small number of broad spaces for go-live simplicity rather than mapping tightly to job function.", "impact": "Restricting tile visibility on the launchpad is cosmetic — the backend authorization for whatever the tile launches still comes from the PFCG role tied to the space, so a broad space can grant sensitive backend access to users who can't even see the corresponding tile.", "objective": "Confirm which users hold backend access to sensitive mass-change functions through their assigned space, independent of tile visibility, and restructure spaces so access maps to actual job function.", "design": "Sensitive catalogs (mass-change, mass-upload, and similar bulk functions) should sit in narrowly assigned spaces tested against real job requirements, separate from the broad spaces used for routine, low-risk apps.", "scope": "All users assigned to any space containing a sensitive mass-change or mass-upload catalog, regardless of whether the corresponding tile is visible on their launchpad.", "scope_source": "Launchpad content role/space assignments (via Manage Launchpad Spaces or /UI2/FLPD_CUST), cross-referenced with the PFCG role tied to each space to identify the actual backend authorization granted.", "scope_check": "Confirm the space-to-role mapping you're using reflects the current configuration, not what was documented at original rollout — spaces sometimes get modified afterward without the documentation catching up.", "fix_approach": "Query every user holding the sensitive space, not a sample — the goal is a precise headcount of who actually has this exposure, not an estimate.", "verification": "The tile-to-catalog-to-space-to-role trace, the full list of users holding the sensitive space, and pilot test results confirming the corrected space structure preserves routine access.", "exec": [{"title": "Part A — Trace the Tile to Its Space and Role", "before": "Start from the specific tile reported, not a general catalog list.", "steps": ["Locate the reported tile in the Launchpad Designer and identify its parent catalog.", "Identify which space(s) include that catalog.", "Identify the PFCG role tied to that space and its authorization objects for the mass-change transaction."], "capture": "The full trace: tile → catalog → space → role → backend authorization."}, {"title": "Part B — Query Who Holds the Sensitive Space", "before": "Confirm you're querying space assignment, not tile visibility — they are configured separately.", "steps": ["Query all users assigned the space identified in Part A.", "Cross-reference each user's actual job function against whether they need the sensitive mass-change access.", "Produce a headcount of users with unnecessary backend exposure."], "capture": "Full user list with space assignment, job function, and necessity determination."}, {"title": "Part C — Rebuild the Space Structure and Pilot Test (Training Namespace)", "before": "Work in your assigned ZZ_TRAIN_ launchpad configuration copy.", "steps": ["Create a new, narrowly scoped space containing only the sensitive mass-change/mass-upload catalogs.", "Reassign only the users identified as needing that access to the new space and role.", "Confirm the broad space, now stripped of the sensitive catalog, still provides the routine apps unaffected users need.", "Run a pilot test with a small user group before planning full rollout."], "capture": "The new space configuration, the reassignment list, and pilot test confirmation that routine access was preserved."}], "evaluation": "A correct rebuild results in exactly the users who need mass-change access holding the narrow space, while every other user's routine apps remain unaffected — any pilot tester reporting a missing routine app means the split removed something it shouldn't have.", "resolution": "Root cause: tile-level visibility restrictions had been assumed sufficient at rollout, but the backend authorization for the sensitive mass-change function was still granted broadly through the space's PFCG role — so dozens of users held real backend access to something almost none of them could even see or knew they had. Fix: split the sensitive catalog into its own narrowly-assigned space, reassigned only the users who actually need it, and piloted the change before full rollout.", "pushback": "Last time we changed launchpad content company-wide, we spent two weeks fielding tickets from people who lost apps they actually needed. How is this time different?", "pushback_model": "This time the sensitive catalog is being split into its own space while the broad space keeps everything else unchanged, instead of restructuring the whole launchpad — and a pilot group tests the change before full rollout, which the last change skipped. Both differences directly target what caused the ticket volume last time.", "escalation": "The clerk who flagged this could just as easily have ignored the tile she didn't recognize. How do you make that kind of reporting more likely to happen again?", "escalation_model": "Make sure there's a visible, low-friction way for any user to flag something that looks off, and — just as important — follow up with the reporter to tell them what happened as a result, so the lesson for her and her colleagues is that reporting something unusual leads somewhere, not that it disappears into a queue."}];
const STORAGE_KEY = 'grcSecurityPrimaryLab_v1';

/* ---------- Trainee Console SSO + progress sync ----------
   Standalone by default: this app works fully offline via localStorage
   with no setup required. If it is opened FROM the Controls Consulting
   Trainee Console, the Console appends #sso_at=<access_token>&sso_rt=<refresh_token>
   to the launch URL; when present, this establishes a Supabase session and
   syncs "Mark Lab Complete" to ctm_electives_progress (course_id =
   'grc_security_primarylab', module_id = 'lab1'..'lab8'), the same pattern
   already used for the Thornfield Primary Lab elective (scc_primarylab).
   If no token is present and no session was previously established here,
   the app runs local-only — nothing about the core lab experience depends
   on this layer. */
const SUPABASE_URL = 'https://blfgwysgekfqhcafofhe.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJsZmd3eXNnZWtmcWhjYWZvZmhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyODY0NDksImV4cCI6MjA5NTg2MjQ0OX0.HPdIMd-X30QBufoL9BVSVte6s_Fc-OOKIq9MbwLrzcI';
const ELECTIVE_COURSE_ID = 'grc_security_primarylab';
let sb = null;
let syncEmail = null;

function labModuleId(labNum) { return 'lab' + labNum; }

function setSyncStatus(text, on) {
  const el = document.getElementById('sync-status');
  if (!el) return;
  el.textContent = text;
  el.className = 'sync-status' + (on ? ' on' : '');
}

async function initSync() {
  try {
    if (!window.supabase || !window.supabase.createClient) { setSyncStatus('Standalone mode (offline)', false); return; }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, storageKey: 'grcSecurityPrimaryLab_sb' }
    });

    // Pick up a fresh SSO handoff from the Trainee Console, if present.
    const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
    const at = hash.get('sso_at');
    const rt = hash.get('sso_rt');
    if (at) {
      try {
        if (rt) {
          await sb.auth.setSession({ access_token: at, refresh_token: rt });
        } else {
          // No refresh token passed through — establish via access token alone where supported.
          await sb.auth.setSession({ access_token: at, refresh_token: at });
        }
      } catch (e) {
        console.warn('SSO setSession failed, falling back to local-only mode:', e);
      }
      // Always scrub the token out of the URL immediately — it should never
      // sit in browser history or be re-submitted on refresh.
      history.replaceState(null, '', location.pathname + location.search);
    }

    const { data: { user } } = await sb.auth.getUser();
    if (user && user.email) {
      syncEmail = user.email;
      setSyncStatus('Synced as ' + syncEmail, true);
      await pullRemoteProgress();
    } else {
      setSyncStatus('Standalone mode (offline)', false);
    }
  } catch (e) {
    console.warn('Sync init failed, continuing in local-only mode:', e);
    setSyncStatus('Standalone mode (offline)', false);
  }
}

async function pullRemoteProgress() {
  if (!sb || !syncEmail) return;
  try {
    const { data, error } = await sb.from('ctm_electives_progress')
      .select('module_id')
      .eq('course_id', ELECTIVE_COURSE_ID);
    if (error) throw error;
    const completedModules = new Set((data || []).map(r => r.module_id));
    LABS.forEach(lab => {
      const ls = labState(lab.lab);
      if (completedModules.has(labModuleId(lab.lab))) ls.complete = true;
    });
    saveState(state);
  } catch (e) {
    console.warn('Could not pull remote progress, using local state only:', e);
  }
}

async function pushLabCompletion(labNum, complete) {
  if (!sb || !syncEmail) return;
  try {
    if (complete) {
      await sb.from('ctm_electives_progress').upsert(
        { email: syncEmail, course_id: ELECTIVE_COURSE_ID, module_id: labModuleId(labNum), completed_at: new Date().toISOString() },
        { onConflict: 'email,course_id,module_id' }
      );
    } else {
      await sb.from('ctm_electives_progress').delete()
        .eq('email', syncEmail).eq('course_id', ELECTIVE_COURSE_ID).eq('module_id', labModuleId(labNum));
    }
  } catch (e) {
    console.warn('Could not sync completion to the Trainee Console, saved locally only:', e);
  }
}

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveState(state) { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
let state = loadState();
function labState(labNum) {
  const key = 'lab' + labNum;
  if (!state[key]) state[key] = { steps: {}, conclusion: '', challengeResponse: '', gateResponse: '', complete: false };
  return state[key];
}

let currentLab = 1;

function renderNav() {
  const nav = document.getElementById('lab-nav');
  nav.innerHTML = '';
  LABS.forEach(lab => {
    const ls = labState(lab.lab);
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = (lab.lab === currentLab ? 'active ' : '') + (ls.complete ? 'done' : '');
    btn.innerHTML = '<span class="num">' + lab.lab + '</span><span class="dom">' + lab.domain + '</span><span class="check"></span>';
    btn.onclick = () => { currentLab = lab.lab; render(); window.scrollTo(0,0); };
    li.appendChild(btn);
    nav.appendChild(li);
  });
  const doneCount = LABS.filter(l => labState(l.lab).complete).length;
  document.getElementById('progress-count').textContent = doneCount + ' of ' + LABS.length;
  document.getElementById('progress-fill').style.width = (doneCount / LABS.length * 100) + '%';
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function renderMain() {
  const lab = LABS.find(l => l.lab === currentLab);
  const ls = labState(lab.lab);
  const main = document.getElementById('main');

  let html = '';
  html += '<div class="rules-banner sans">';
  html += '<div><b>Practice namespace only.</b> Every hands-on build happens in your assigned ZZ_TRAIN_ role, ruleset, or workflow copy — never in a production object.</div>';
  html += '<div><b>Planning card before transaction code.</b> If you can\'t state what's broken, why it matters, and what the fix needs to look like, you\'re not ready to open a transaction yet.</div>';
  html += '</div>';

  html += '<div class="lab-header">';
  html += '<p class="eyebrow sans">Domain: ' + esc(lab.domain) + '</p>';
  html += '<h2>Lab ' + lab.lab + ' — ' + esc(lab.book) + '</h2>';
  html += '<p class="companion">Companion onboarding manual: Book ' + lab.lab + ', Junior SAP GRC/Security Consultant Edition, V1</p>';
  html += '</div>';

  const fields = [
    ['1', 'The Ticket', lab.ticket], ['2', 'Process', lab.process], ['3', 'Why It Matters', lab.impact],
    ['4', 'Fix Objective', lab.objective], ['5', 'Target Design', lab.design],
    ['6', 'Scope — What\\'s Affected', lab.scope], ['7', 'Where to Look', lab.scope_source],
    ['8', 'Confirm You Found Everything', lab.scope_check], ['9', 'Fix Approach', lab.fix_approach],
    ['10', 'Verification Evidence', lab.verification]
  ];
  fields.forEach(([n, label, text]) => {
    html += '<div class="field"><h3><span class="fn">' + n + '</span> ' + label + '</h3><p>' + esc(text) + '</p></div>';
  });

  // Field 11: Execution Steps
  html += '<div class="field"><h3><span class="fn">11</span> Execution Steps</h3>';
  html += '<div class="callout"><b class="sans">HANDS-ON — PRACTICE NAMESPACE</b>Build and save only in your assigned ZZ_TRAIN_ role/ruleset/workflow copy. Never edit a production role, ruleset, or workflow during this lab.</div>';
  lab.exec.forEach((part, pi) => {
    html += '<div class="exec-part">';
    html += '<h4>' + esc(part.title) + '</h4>';
    html += '<p class="before"><b>Before you start:</b> ' + esc(part.before) + '</p>';
    html += '<ol>';
    part.steps.forEach((s, si) => {
      const stepKey = pi + '_' + si;
      const checked = ls.steps[stepKey] ? 'checked' : '';
      const doneClass = ls.steps[stepKey] ? 'done-text' : '';
      html += '<li><label><input type="checkbox" data-step="' + stepKey + '" ' + checked + '><span class="' + doneClass + '">' + esc(s) + '</span></label></li>';
    });
    html += '</ol>';
    html += '<p class="capture sans"><b>What to capture:</b> ' + esc(part.capture) + '</p>';
    html += '</div>';
  });
  html += '</div>';

  html += '<div class="field"><h3><span class="fn">12</span> Evaluation</h3><p>' + esc(lab.evaluation) + '</p></div>';

  // Field 13: Resolution
  html += '<div class="field"><h3><span class="fn">13</span> Resolution</h3>';
  html += '<p class="sans" style="font-size:13.5px;color:var(--ink-soft);margin-bottom:8px;"><b>Your resolution write-up</b> — write it in your own words before revealing the model.</p>';
  html += '<textarea id="conclusion-input" placeholder="Type your resolution write-up here...">' + esc(ls.conclusion) + '</textarea>';
  html += '<button class="reveal-btn" id="conclusion-reveal-btn">Reveal model resolution</button>';
  html += '<div class="model-box' + (ls.conclusionRevealed ? ' shown' : '') + '" id="conclusion-model"><div class="tag">MODEL ANSWER</div><p>' + esc(lab.resolution) + '</p></div>';
  html += '</div>';

  // Field 14: Stakeholder Pushback
  html += '<div class="field"><h3><span class="fn">14</span> Stakeholder Pushback</h3>';
  html += '<div class="challenge-quote">&ldquo;' + esc(lab.pushback) + '&rdquo;</div>';
  html += '<textarea id="challenge-input" placeholder="Type your response here...">' + esc(ls.challengeResponse) + '</textarea>';
  html += '<button class="reveal-btn" id="challenge-reveal-btn">Reveal model response</button>';
  html += '<div class="model-box' + (ls.challengeRevealed ? ' shown' : '') + '" id="challenge-model"><div class="tag">MODEL ANSWER</div><p>' + esc(lab.pushback_model) + '</p></div>';
  html += '</div>';

  // Field 15: Escalation Conversation
  html += '<div class="gate-section">';
  html += '<details class="gate-toggle" ' + (ls.gateOpened ? 'open' : '') + ' id="gate-details">';
  html += '<summary class="sans">Field 15 — Facilitator-Only Escalation Conversation (click to expand once your independent run is complete)</summary>';
  html += '<div class="warn sans">Facilitators: ask this after the trainee has completed the lab independently. Not for trainees to review in advance.</div>';
  html += '<div class="gq">&ldquo;' + esc(lab.escalation) + '&rdquo;</div>';
  html += '<textarea id="gate-input" placeholder="Trainee\'s spoken answer, noted here...">' + esc(ls.gateResponse) + '</textarea>';
  html += '<button class="gate-btn" id="gate-reveal-btn">Reveal model answer</button>';
  html += '<div class="model-box' + (ls.gateRevealed ? ' shown' : '') + '" id="gate-model"><div class="tag">MODEL ANSWER</div><p>' + esc(lab.escalation_model) + '</p></div>';
  html += '</details>';
  html += '</div>';

  html += '<div class="complete-row">';
  html += '<span class="status' + (ls.complete ? ' done' : '') + ' sans">' + (ls.complete ? '✓ Lab marked complete' : 'Not yet marked complete') + '</span>';
  html += '<button class="action-btn" id="complete-btn">' + (ls.complete ? 'Mark as Not Complete' : 'Mark Lab Complete') + '</button>';
  html += '</div>';

  main.innerHTML = html;
  wireInteractions(lab, ls);
}

function wireInteractions(lab, ls) {
  document.querySelectorAll('input[type=checkbox][data-step]').forEach(cb => {
    cb.addEventListener('change', () => {
      ls.steps[cb.dataset.step] = cb.checked;
      saveState(state);
      const span = cb.parentElement.querySelector('span');
      span.className = cb.checked ? 'done-text' : '';
    });
  });

  document.getElementById('conclusion-input').addEventListener('input', (e) => { ls.conclusion = e.target.value; saveState(state); });
  document.getElementById('conclusion-reveal-btn').addEventListener('click', () => {
    ls.conclusionRevealed = true; saveState(state);
    document.getElementById('conclusion-model').classList.add('shown');
  });

  document.getElementById('challenge-input').addEventListener('input', (e) => { ls.challengeResponse = e.target.value; saveState(state); });
  document.getElementById('challenge-reveal-btn').addEventListener('click', () => {
    ls.challengeRevealed = true; saveState(state);
    document.getElementById('challenge-model').classList.add('shown');
  });

  document.getElementById('gate-details').addEventListener('toggle', (e) => { ls.gateOpened = e.target.open; saveState(state); });
  document.getElementById('gate-input').addEventListener('input', (e) => { ls.gateResponse = e.target.value; saveState(state); });
  document.getElementById('gate-reveal-btn').addEventListener('click', () => {
    ls.gateRevealed = true; saveState(state);
    document.getElementById('gate-model').classList.add('shown');
  });

  document.getElementById('complete-btn').addEventListener('click', () => {
    ls.complete = !ls.complete; saveState(state);
    pushLabCompletion(lab.lab, ls.complete);
    render();
  });
}

function render() { renderNav(); renderMain(); }

(async function start() {
  render();
  await initSync();
  render();
})();
</script>
</body>
</html>

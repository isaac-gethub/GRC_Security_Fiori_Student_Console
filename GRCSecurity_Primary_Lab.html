<!DOCTYPE html>
<html lang="en">
<head>

<title>SAP GRC / Security Primary Lab — Calder Ridge Manufacturing</title>
<style>
  :root {
    --navy: #1F3864;
    --navy-deep: #142545;
    --gold: #9C7A22;
    --gold-light: #C79A3D;
    --paper: #FAF9F6;
    --panel: #FFFFFF;
    --ink: #1D1D1B;
    --ink-soft: #55524C;
    --line: #DAD5C8;
    --callout: #F2F0E8;
    --model: #EAF0EA;
    --gate: #2A2320;
    --gate-ink: #F1EADD;
    --ok: #3E6B4F;
    --radius: 3px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.55;
  }
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }

  /* ---------- Shell ---------- */
  .shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: 300px; flex-shrink: 0;
    background: var(--navy-deep);
    color: #E9E4D8;
    padding: 28px 0 40px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { padding: 0 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.12); }
  .brand .kicker { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; letter-spacing: 0.06em; color: var(--gold-light); margin: 0 0 6px; }
  .brand h1 { font-size: 21px; margin: 0 0 4px; line-height: 1.25; font-weight: 600; }
  .brand p { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12.5px; color: #B9B2A0; margin: 0; }

  .progress-block { padding: 18px 24px; border-bottom: 1px solid rgba(255,255,255,0.12); font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  .progress-block .label { font-size: 12px; color: #B9B2A0; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .progress-track { height: 6px; background: rgba(255,255,255,0.14); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-light)); transition: width 0.4s ease; }

  .lab-nav { list-style: none; margin: 0; padding: 10px 12px; }
  .lab-nav li { margin-bottom: 2px; }
  .lab-nav button {
    width: 100%; text-align: left; background: none; border: none; color: #D9D3C4;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13.5px;
    padding: 11px 12px; border-radius: var(--radius); cursor: pointer; display: flex; align-items: center; gap: 10px;
  }
  .lab-nav button:hover { background: rgba(255,255,255,0.06); }
  .lab-nav button.active { background: rgba(255,255,255,0.11); color: #fff; }
  .lab-nav .num { font-weight: 700; color: var(--gold-light); width: 20px; flex-shrink: 0; }
  .lab-nav .dom { flex: 1; }
  .lab-nav .check { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #6b6656; flex-shrink: 0; }
  .lab-nav button.done .check { background: var(--gold-light); border-color: var(--gold-light); }

  .footer-link { padding: 16px 24px 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  .footer-link a { color: #D9D3C4; font-size: 12.5px; text-decoration: none; border-bottom: 1px dotted #6b6656; }
  .footer-link a:hover { color: #fff; }
  .sync-status { margin-top: 10px; font-size: 11.5px; color: #8b8878; }
  .sync-status.on { color: var(--gold-light); }

  /* ---------- Main content ---------- */
  .main { flex: 1; padding: 48px 56px 100px; max-width: 900px; }
  .rules-banner {
    display: flex; gap: 20px; background: var(--gate); color: var(--gate-ink);
    padding: 14px 20px; border-radius: var(--radius); margin-bottom: 36px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12.5px; flex-wrap: wrap;
  }
  .rules-banner div { flex: 1; min-width: 220px; }
  .rules-banner b { color: var(--gold-light); }

  .lab-header .eyebrow { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12.5px; color: var(--ink-soft); margin: 0 0 6px; }
  .lab-header h2 { font-size: 30px; margin: 0 0 4px; color: var(--navy); line-height: 1.2; }
  .lab-header .companion { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12.5px; color: var(--ink-soft); font-style: italic; margin-bottom: 34px; }

  .field { margin-bottom: 30px; }
  .field h3 {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 13.5px; text-transform: none; color: var(--navy);
    border-bottom: 2px solid var(--line); padding-bottom: 6px; margin: 0 0 10px;
    display: flex; align-items: baseline; gap: 8px;
  }
  .field h3 .fn { color: var(--gold); font-weight: 700; }
  .field p { margin: 0 0 10px; font-size: 16px; }

  .exec-part { margin: 18px 0 22px; padding-left: 18px; border-left: 3px solid var(--line); }
  .exec-part h4 { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14.5px; color: var(--gold); margin: 0 0 8px; }
  .exec-part .before { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13.5px; font-style: italic; color: var(--ink-soft); margin-bottom: 10px; }
  .exec-part ol { margin: 0 0 10px; padding-left: 22px; }
  .exec-part li { margin-bottom: 8px; font-size: 15.5px; }
  .exec-part li label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  .exec-part li input[type=checkbox] { margin-top: 5px; flex-shrink: 0; }
  .exec-part li span.done-text { text-decoration: line-through; color: #8b8878; }
  .capture { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; color: var(--ink-soft); background: var(--callout); padding: 8px 12px; border-radius: var(--radius); }
  .capture b { color: var(--ink); }

  .callout {
    background: var(--callout); border-left: 4px solid var(--gold);
    padding: 14px 18px; border-radius: var(--radius); margin: 8px 0 20px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13.5px; color: var(--ink);
  }
  .callout b { display: block; color: var(--navy); margin-bottom: 4px; font-size: 12.5px; letter-spacing: 0.02em; }

  textarea {
    width: 100%; min-height: 110px; font-family: Georgia, serif; font-size: 15.5px;
    border: 1.5px solid var(--line); border-radius: var(--radius); padding: 12px 14px;
    resize: vertical; background: var(--panel); color: var(--ink);
  }
  textarea:focus { outline: none; border-color: var(--navy); }

  .reveal-btn, .gate-btn, .action-btn {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 600;
    background: var(--navy); color: #fff; border: none; padding: 9px 18px;
    border-radius: var(--radius); cursor: pointer; margin-top: 10px;
  }
  .reveal-btn:hover, .gate-btn:hover, .action-btn:hover { background: var(--navy-deep); }
  .reveal-btn:disabled { background: #C9C4B6; cursor: not-allowed; }

  .model-box {
    display: none; margin-top: 12px; background: var(--model); border-left: 4px solid var(--ok);
    padding: 14px 18px; border-radius: var(--radius);
  }
  .model-box.shown { display: block; }
  .model-box .tag { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11.5px; font-weight: 700; color: var(--ok); letter-spacing: 0.04em; margin-bottom: 6px; }
  .model-box p { margin: 0; font-size: 15.5px; }

  .challenge-quote {
    font-size: 18px; font-style: italic; color: var(--navy); border-left: 4px solid var(--navy);
    padding: 4px 0 4px 18px; margin: 6px 0 14px;
  }

  .gate-section {
    margin-top: 40px; background: var(--gate); color: var(--gate-ink);
    padding: 22px 24px; border-radius: var(--radius);
  }
  .gate-section .warn { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; color: var(--gold-light); margin-bottom: 10px; }
  .gate-section .gq { font-size: 17px; font-style: italic; margin-bottom: 12px; }
  .gate-section textarea { background: #3A322D; border-color: #574C41; color: var(--gate-ink); }
  .gate-section .model-box { background: #33392E; border-left-color: var(--gold-light); }
  .gate-section .model-box .tag { color: var(--gold-light); }
  details.gate-toggle summary { cursor: pointer; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12.5px; color: var(--gold-light); margin-bottom: 14px; }

  .complete-row { display: flex; align-items: center; justify-content: space-between; margin-top: 44px; padding-top: 24px; border-top: 1px solid var(--line); }
  .complete-row .status { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; color: var(--ink-soft); }
  .complete-row .status.done { color: var(--ok); font-weight: 600; }

  @media (max-width: 880px) {
    .shell { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: relative; padding-bottom: 10px; }
    .main { padding: 32px 20px 80px; }
    .lab-header h2 { font-size: 24px; }
  }
  @media (max-width: 600px) {
    .rules-banner { flex-direction: column; gap: 10px; }
    .field p, .exec-part li { font-size: 15px; }
  }
</style>
</head>

<script>
const LABS = [{"lab": 1, "book": "The Ruleset That Went Quiet", "domain": "Access Risk Analysis / SoD Ruleset Design", "situation": "Calder Ridge's quarterly SoD violation report from GRC Access Control has shown near-zero violations for three straight quarters \u2014 a pattern that looks clean but coincides with a Fiori rollout eighteen months ago that retired several classic transaction codes without anyone updating the ruleset's function definitions to match.", "process": "Procure-to-pay staff create and maintain vendor master records and post vendor payments. The SoD rule in question exists to flag any single user able to perform both.", "risk": "A user with both vendor-master and payment-posting access could create a fictitious or altered vendor and pay it without independent detection \u2014 and the ruleset's outdated function scope means that access combination is no longer being watched for at all.", "objective": "Ensure the SoD ruleset's function definitions reflect the transaction codes and Fiori apps the business actually executes today, so real access conflicts in procure-to-pay are detected rather than silently missed.", "design": "A GRC Access Control ruleset defines each function's action list (transaction codes / Fiori app IDs). When the business's execution layer changes, the function definitions must be updated in lockstep, or the rule stops watching the real risk while still appearing to exist.", "population": "All function IDs within the procure-to-pay risk category whose action lists reference transaction codes retired or superseded in the last Fiori rollout.", "pop_source": "GRC Access Control's function maintenance configuration (SPRO > GRC > Access Control > Maintain Functions), cross-referenced against the Fiori app-to-backend-transaction mapping list from the rollout project.", "completeness": "Reconcile the exported function list count against the ruleset's total function count in the GRC configuration UI, and confirm the Fiori mapping list used for cross-reference is the final rollout version, not an interim draft.", "sampling": "Full population review, not a sample \u2014 every procure-to-pay function definition must be checked, because a single missed function can hide an entire class of undetected conflict.", "evidence": "Screenshots of each affected function's action list before and after correction, the training-ruleset risk analysis rerun showing the newly surfaced conflicts, and the documented mapping table tying old transaction codes to their Fiori/backend replacements.", "exec": [{"title": "Part A \u2014 Run the Baseline Risk Analysis", "before": "Confirm you are in the designated training client, signed in with your assigned training user ID.", "steps": ["Access GRAC_SPM (or the Access Risk Analysis Fiori app).", "Run a risk analysis for the procure-to-pay risk category at user level, full user population.", "Export the result set and note the total violation count."], "capture": "Risk analysis run date/time, total violation count, risk ID(s) reviewed."}, {"title": "Part B \u2014 Trace a Function's Action List", "before": "Have the current Fiori-to-backend transaction mapping list open for reference.", "steps": ["Navigate to the Maintain Functions configuration for the flagged risk's function IDs.", "Open each function's action list and record every transaction code / Fiori app ID currently included.", "Cross-check each entry against the mapping list to identify retired codes with no listed replacement."], "capture": "Function ID, current action list, any retired codes found, their correct replacement app ID."}, {"title": "Part C \u2014 Update the Function and Retest (Practice Namespace)", "before": "Confirm the practice ruleset copy assigned to you (prefixed ZZ_TRAIN_) is the one you are editing \u2014 never the live ruleset.", "steps": ["In your training ruleset copy, add the correct current Fiori app ID / backend transaction to the affected function's action list.", "Save and generate the updated rule.", "Rerun the risk analysis against the same user population using the training ruleset.", "Compare the new violation count against Part A's baseline."], "capture": "Before/after violation counts, screenshot of the corrected function definition, names of any newly surfaced conflicted users."}], "evaluation": "A properly corrected function should surface conflicts that existed all along but were invisible to the outdated rule. If the count doesn't change at all after correction, re-check that the correct app ID was actually added and saved to the training ruleset.", "conclusion_model": "The ruleset's function definitions had not been updated after the Fiori rollout, which meant a real, ongoing SoD conflict in procure-to-pay had gone undetected for over a year. Correcting the function's action list to reflect current transaction usage restored the rule's ability to detect the risk it was originally built for.", "challenge": "The business risk owner signed off on the original ruleset scope. Doesn't that sign-off cover this too?", "challenge_model": "A scope sign-off covers the ruleset as it existed at that point in time; it does not anticipate every future change to how the business executes its processes. When the underlying transaction landscape changes materially \u2014 such as a Fiori migration retiring transaction codes \u2014 the ruleset needs to be revalidated against current reality, regardless of how firmly the original scope was approved.", "gate": "If updating this function's action list caused the violation count to jump from near-zero to double digits overnight, how would you communicate that to the client without it sounding like the consulting team just created a new problem?", "gate_model": "Frame it as detection catching up to reality, not a new risk being created \u2014 the conflicts existed the entire time; the correction simply made them visible again. Lead with the population and evidence (how many users, what access, how long), not with blame toward whoever built the original ruleset, and pair the finding with a remediation plan in the same conversation."}, {"lab": 2, "book": "The Shared Login", "domain": "Emergency Access Management (Firefighter)", "situation": "A three-month backlog of Firefighter log reports shows every entry as \"reviewed,\" but the reviewer field on every one is the same controller who was on leave for six of those weeks.", "process": "Firefighter ID FF_FI_02 is used during month-end close by whoever on the finance team happens to be handling it that cycle, rather than a single named individual.", "risk": "Shared use of a Firefighter ID breaks individual accountability \u2014 if something goes wrong during a session, there is no reliable way to determine who actually performed it, and a reviewed-but-not-actually-reviewed log gives false assurance that nothing did.", "objective": "Confirm that Firefighter sessions map to a single identifiable individual, and that log reviews are evidenced, independent, and actually performed by someone who was available to perform them.", "design": "Each Firefighter ID assignment should be individual and time-bound; each session's log should be reviewed by a designated reviewer within a defined window, with documented evidence of that review distinct from a status flag.", "population": "All Firefighter sessions on FF_FI_02 (and any other shared-use IDs identified) over the backlog period, plus the corresponding review records.", "pop_source": "GRAC_SPM Firefighter Log Report for the assignment and session history; badge/VPN access logs and leave/calendar records as independent corroboration.", "completeness": "Confirm the log report's session count for the period matches the raw system log table count for that Firefighter ID \u2014 a filtered or date-truncated export will understate the true population.", "sampling": "Full population for the backlog period under review; a targeted sample of sessions with no corroborating badge/VPN match for deeper investigation.", "evidence": "Log report export, badge/VPN reconciliation worksheet showing matched and unmatched sessions, and the corrected review-evidence template once redesigned.", "exec": [{"title": "Part A \u2014 Pull the Log Report and Reviewer Field", "before": "Identify the Firefighter ID(s) and date range in scope before opening the report.", "steps": ["Run the Firefighter Log Report for FF_FI_02 over the backlog period.", "Record the reviewer field and review-status flag for each session.", "Cross-check the reviewer's leave/calendar record for the review dates shown."], "capture": "Session list, reviewer per session, any sessions reviewed during the reviewer's confirmed leave."}, {"title": "Part B \u2014 Reconcile Sessions to People", "before": "Have badge or VPN log access ready; this step is a manual reperformance and will take longer than a report pull.", "steps": ["For each session, identify the login timestamp and duration.", "Match the timestamp against badge/VPN records to identify who was physically or remotely present.", "Flag any session with no matching individual record."], "capture": "Matched sessions with identified individual, unmatched sessions requiring follow-up."}, {"title": "Part C \u2014 Configure Individual Assignment and Expedited Approval (Training Namespace)", "before": "Work in your assigned training EAM configuration copy, not the live Firefighter ID assignment.", "steps": ["Build an individual Firefighter assignment for a named test user in the training configuration.", "Configure an expedited MSMP approval path for that assignment type with a same-day service level.", "Simulate a month-end request end to end and confirm it resolves to one named individual with a timestamped approval."], "capture": "Screenshot of the individual assignment, the expedited approval path configuration, and the completed test request."}], "evaluation": "If sessions remain unmatched to any individual after reconciliation, treat that as a control gap requiring escalation, not an inconclusive result to set aside.", "conclusion_model": "Firefighter ID FF_FI_02 was shared across multiple users, and its log reviews were being marked complete by a reviewer who was on leave for part of the period \u2014 meaning neither individual accountability nor independent review was actually operating, despite the system showing both as satisfied.", "challenge": "If I make everyone wait for individual Firefighter provisioning, month-end doesn't close on schedule. Isn't that a business problem too?", "challenge_model": "It is a real business problem, and dismissing it will lose the room. The fix isn't choosing between speed and accountability \u2014 it's building an approval path fast enough to meet the business need while still keeping assignment individual, which is exactly what Part C's expedited path demonstrates is possible.", "gate": "The team lead whose staff used the shared login isn't hiding anything and is embarrassed once the finding surfaces. How do you deliver this finding without making it feel like an accusation?", "gate_model": "Separate the finding from the person: the finding is the shared-use pattern and the review gap, not any individual's judgment. Acknowledge the real scheduling pressure that led to the workaround, and bring a working alternative (the expedited path) to the same conversation as the finding, not as an afterthought."}, {"lab": 3, "book": "The Split That Closed a Door", "domain": "Business Role Design & PFCG", "situation": "A composite role carrying an SoD conflict was split into two roles over a weekend go-live. By Monday morning, the AP team can no longer complete a routine, non-conflicting task that the split accidentally severed.", "process": "AP staff perform a three-way match step that touches both a vendor-side field and a payment-side transaction on the same screen \u2014 a legitimate task that doesn't itself create an SoD conflict.", "risk": "Splitting a role along transaction-code lines rather than authorization-object lines can either leave a shared object creating a new conflict, or remove an object needed for a legitimate task that happened to share ground with the removed access.", "objective": "Restore the severed legitimate access without recreating the original SoD conflict the split was designed to close.", "design": "Role splits should be scoped at the authorization-object and field-value level, verified against both the conflict being closed and every legitimate task the affected users still need to perform.", "population": "The two split roles (vendor maintenance and payment posting), their full authorization object lists, and the specific field-level values in each.", "pop_source": "PFCG role authorization data for both roles (via the role's authorization tab or a SUIM authorization-object report), compared against the original composite role's authorization data as a baseline.", "completeness": "Confirm the pulled authorization object list for each role includes all objects, not just the ones added or changed during the split \u2014 an incremental change log will miss inherited objects.", "sampling": "Not a sample \u2014 every authorization object in both split roles must be compared against the original composite role to find the specific missing object.", "evidence": "Side-by-side authorization object comparison, the specific object and field values causing the gap, and QA test results confirming the corrected role restores the task without reopening the SoD conflict.", "exec": [{"title": "Part A \u2014 Compare Composite vs. Split Role Authorizations", "before": "Have the original composite role's authorization data exported before it's decommissioned or hard to retrieve.", "steps": ["Export the full authorization object list, with field values, for the original composite role.", "Export the same for both resulting split roles.", "Line up all three side by side to identify what each split role kept, dropped, or shares."], "capture": "Full three-way authorization object comparison table."}, {"title": "Part B \u2014 Identify the Missing Non-Conflicting Object", "before": "Know the exact SoD conflict definition (which two authorizations together create the risk) before starting this step.", "steps": ["From the comparison, identify the object(s) present in the composite role but missing from both split roles.", "Confirm this object is not one of the two authorizations that create the original SoD conflict.", "Document the object and field values needed to restore the legitimate task."], "capture": "The specific authorization object and field values required, with confirmation it does not overlap the SoD conflict definition."}, {"title": "Part C \u2014 Rebuild the Role and Retest (Training Namespace)", "before": "Work in your assigned ZZ_TRAIN_ copy of the affected role, not the production role.", "steps": ["Add the missing authorization object and field values to your training copy of the vendor-maintenance role.", "Save and generate the role.", "Run a risk analysis against the corrected role combination to confirm the original SoD conflict does not reappear.", "Have a business tester (or simulated test script) execute the three-way match step against the corrected role."], "capture": "Confirmation the SoD conflict stays closed, and confirmation the three-way match step now completes successfully."}], "evaluation": "A correct fix restores the specific legitimate task without any change to the SoD risk analysis result. If the risk analysis result changes at all after your fix, you've likely restored more than the one missing object.", "conclusion_model": "The original split was scoped along transaction-code lines rather than authorization-object lines, which left a legitimate cross-functional task without an object it needed even though that object had nothing to do with the actual SoD conflict. Restoring the specific missing object closed the gap without reopening the conflict.", "challenge": "You fixed a report and broke my process. How do I know the next fix won't break something else?", "challenge_model": "Because this time the correction was verified two ways: a risk analysis rerun confirming the SoD conflict stays closed, and a business tester actually executing the affected task before sign-off \u2014 not consultant certification alone. That combination is what should accompany every role change going forward, not just this one.", "gate": "The business wants the fix live today. Testing properly will take until tomorrow. How do you handle that conversation?", "gate_model": "Name the trade-off directly rather than absorbing the pressure silently: a same-day fix without business testing carries the same risk that caused this incident in the first place. Offer the fastest path that still includes a business tester's confirmation, even if that means a few hours' delay, and let the business decide with that trade-off stated plainly rather than assuming speed is always what they'd choose if they understood the risk."}, {"lab": 4, "book": "The Approval Nobody Sent", "domain": "MSMP Workflow (GRC Access Control)", "situation": "A request for a sample of rejected access requests comes back empty \u2014 every single access request in the last eighteen months shows as approved, with no exceptions.", "process": "Access requests route through an MSMP workflow stage to a designated approver; if the approver doesn't act within 48 hours, the request is meant to escalate.", "risk": "If the escalation path resolves an unanswered request as approved by default rather than escalating to another human, an access-approval control that looks fully operating is, in substance, granting access with no actual review at all.", "objective": "Confirm that access requests are resolved by an actual approver decision, and that any timeout path escalates to a person rather than defaulting to approval.", "design": "MSMP workflow stages use agent determination and BRF+ rules to route requests and handle non-response; a properly designed timeout path escalates to a named backup approver, and eventually to their manager, without ever auto-resolving to approved.", "population": "All access requests over the review period, categorized by resolution type: approved by a named approver's action, versus resolved via a timeout/fallback path.", "pop_source": "The MSMP workflow log table (or GRC AC's request history with resolution-type detail), queried directly rather than relying on the workflow's own summary status field.", "completeness": "Confirm the log table query covers the full review period and all workflow templates in use, not just the primary access-request template \u2014 multiple templates can exist for different request types.", "sampling": "Full population analysis of resolution type; a sample of individual requests resolved via timeout, reperformed against the actual configuration to confirm how the fallback behaved.", "evidence": "The resolution-type query output, the workflow stage configuration showing the fallback rule, and the training-environment test proving the redesigned escalation chain never auto-approves.", "exec": [{"title": "Part A \u2014 Query Resolution Types", "before": "Get read access to the workflow log table or its GRC AC reporting equivalent before starting.", "steps": ["Query the workflow log for all access requests in the review period.", "Categorize each by resolution type: explicit approver action vs. timeout/fallback resolution.", "Calculate what percentage of the total was resolved via fallback rather than a human decision."], "capture": "Resolution-type breakdown and the fallback percentage."}, {"title": "Part B \u2014 Trace the Stage Configuration", "before": "Identify which specific workflow stage and template is generating the fallback behavior before opening configuration.", "steps": ["Navigate to the MSMP workflow configuration for the affected stage.", "Locate the agent determination rule and its function labModuleId(labNum) { return 'lab' + labNum; }

function setSyncStatus(text, on) {
  const el = document.getElementById('sync-status');
  if (!el) return;
  el.textContent = text;
  el.className = 'sync-status' + (on ? ' on' : '');
}

async function initSync() {
  try {
    if (!window.supabase || !window.supabase.createClient) { setSyncStatus('Standalone mode (offline)', false); return; }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, storageKey: 'grcSecurityPrimaryLab_sb' }
    });

    // Pick up a fresh SSO handoff from the Trainee Console, if present.
    const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
    const at = hash.get('sso_at');
    const rt = hash.get('sso_rt');
    if (at) {
      try {
        if (rt) {
          await sb.auth.setSession({ access_token: at, refresh_token: rt });
        } else {
          // No refresh token passed through — establish via access token alone where supported.
          await sb.auth.setSession({ access_token: at, refresh_token: at });
        }
      } catch (e) {
        console.warn('SSO setSession failed, falling back to local-only mode:', e);
      }
      // Always scrub the token out of the URL immediately — it should never
      // sit in browser history or be re-submitted on refresh.
      history.replaceState(null, '', location.pathname + location.search);
    }

    const { data: { user } } = await sb.auth.getUser();
    if (user && user.email) {
      syncEmail = user.email;
      setSyncStatus('Synced as ' + syncEmail, true);
      await pullRemoteProgress();
    } else {
      setSyncStatus('Standalone mode (offline)', false);
    }
  } catch (e) {
    console.warn('Sync init failed, continuing in local-only mode:', e);
    setSyncStatus('Standalone mode (offline)', false);
  }
}

  html += '<div class="rules-banner sans">';
  html += '<div><b>Practice namespace only.</b> Every hands-on build happens in your assigned ZZ_TRAIN_ role, ruleset, or workflow copy — never in a production object.</div>';
  html += '<div><b>Planning card before transaction code.</b> If you can\'t state your population, risk, and control objective, you\'re not ready to open a transaction yet.</div>';
  html += '</div>';

  html += '<div class="lab-header">';
  html += '<p class="eyebrow sans">Domain: ' + esc(lab.domain) + '</p>';
  html += '<h2>Lab ' + lab.lab + ' — ' + esc(lab.book) + '</h2>';
  html += '<p class="companion">Companion onboarding manual: Book ' + lab.lab + ', Junior SAP GRC/Security Consultant Edition, V1</p>';
  html += '</div>';

  const fields = [
    ['1', 'Situation', lab.situation], ['2', 'Process', lab.process], ['3', 'Business Risk', lab.risk],
    ['4', 'Control Objective', lab.objective], ['5', 'Control Design', lab.design],
    ['6', 'Population Definition', lab.population], ['7', 'Population Source', lab.pop_source],
    ['8', 'Completeness and Accuracy', lab.completeness], ['9', 'Sampling Approach', lab.sampling],
    ['10', 'Evidence Plan', lab.evidence]
  ];
  fields.forEach(([n, label, text]) => {
    html += '<div class="field"><h3><span class="fn">' + n + '</span> ' + label + '</h3><p>' + esc(text) + '</p></div>';
  });

  // Field 11: Execution Steps
  html += '<div class="field"><h3><span class="fn">11</span> Execution Steps</h3>';
  html += '<div class="callout"><b class="sans">HANDS-ON — PRACTICE NAMESPACE</b>Build and save only in your assigned ZZ_TRAIN_ role/ruleset/workflow copy. Never edit a production role, ruleset, or workflow during this lab.</div>';
  lab.exec.forEach((part, pi) => {
    html += '<div class="exec-part">';
    html += '<h4>' + esc(part.title) + '</h4>';
    html += '<p class="before"><b>Before you start:</b> ' + esc(part.before) + '</p>';
    html += '<ol>';
    part.steps.forEach((s, si) => {
      const stepKey = pi + '_' + si;
      const checked = ls.steps[stepKey] ? 'checked' : '';
      const doneClass = ls.steps[stepKey] ? 'done-text' : '';
      html += '<li><label><input type="checkbox" data-step="' + stepKey + '" ' + checked + '><span class="' + doneClass + '">' + esc(s) + '</span></label></li>';
    });
    html += '</ol>';
    html += '<p class="capture sans"><b>What to capture:</b> ' + esc(part.capture) + '</p>';
    html += '</div>';
  });
  html += '</div>';

  html += '<div class="field"><h3><span class="fn">12</span> Evaluation</h3><p>' + esc(lab.evaluation) + '</p></div>';

  // Field 13: Conclusion
  html += '<div class="field"><h3><span class="fn">13</span> Conclusion</h3>';
  html += '<p class="sans" style="font-size:13.5px;color:var(--ink-soft);margin-bottom:8px;"><b>Your conclusion</b> — write it in your own words before revealing the model.</p>';
  html += '<textarea id="conclusion-input" placeholder="Type your conclusion here...">' + esc(ls.conclusion) + '</textarea>';
  html += '<button class="reveal-btn" id="conclusion-reveal-btn">Reveal model conclusion</button>';
  html += '<div class="model-box' + (ls.conclusionRevealed ? ' shown' : '') + '" id="conclusion-model"><div class="tag">MODEL ANSWER</div><p>' + esc(lab.conclusion_model) + '</p></div>';
  html += '</div>';

  // Field 14: Reviewer Challenge
  html += '<div class="field"><h3><span class="fn">14</span> Reviewer Challenge</h3>';
  html += '<div class="challenge-quote">&ldquo;' + esc(lab.challenge) + '&rdquo;</div>';
  html += '<textarea id="challenge-input" placeholder="Type your response here...">' + esc(ls.challengeResponse) + '</textarea>';
  html += '<button class="reveal-btn" id="challenge-reveal-btn">Reveal model response</button>';
  html += '<div class="model-box' + (ls.challengeRevealed ? ' shown' : '') + '" id="challenge-model"><div class="tag">MODEL ANSWER</div><p>' + esc(lab.challenge_model) + '</p></div>';
  html += '</div>';

  // Field 15: Gate
  html += '<div class="gate-section">';
  html += '<details class="gate-toggle" ' + (ls.gateOpened ? 'open' : '') + ' id="gate-details">';
  html += '<summary class="sans">Field 15 — Facilitator-Only Gate Question (click to expand once your independent run is complete)</summary>';
  html += '<div class="warn sans">Facilitators: ask this after the trainee has completed the lab independently. Not for trainees to review in advance.</div>';
  html += '<div class="gq">&ldquo;' + esc(lab.gate) + '&rdquo;</div>';
  html += '<textarea id="gate-input" placeholder="Trainee\'s spoken answer, noted here...">' + esc(ls.gateResponse) + '</textarea>';
  html += '<button class="gate-btn" id="gate-reveal-btn">Reveal model answer</button>';
  html += '<div class="model-box' + (ls.gateRevealed ? ' shown' : '') + '" id="gate-model"><div class="tag">MODEL ANSWER</div><p>' + esc(lab.gate_model) + '</p></div>';
  html += '</details>';
  html += '</div>';

  html += '<div class="complete-row">';
  html += '<span class="status' + (ls.complete ? ' done' : '') + ' sans">' + (ls.complete ? '✓ Lab marked complete' : 'Not yet marked complete') + '</span>';
  html += '<button class="action-btn" id="complete-btn">' + (ls.complete ? 'Mark as Not Complete' : 'Mark Lab Complete') + '</button>';
  html += '</div>';

  main.innerHTML = html;
  wireInteractions(lab, ls);
}

function wireInteractions(lab, ls) {
  document.querySelectorAll('input[type=checkbox][data-step]').forEach(cb => {
    cb.addEventListener('change', () => {
      ls.steps[cb.dataset.step] = cb.checked;
      saveState(state);
      const span = cb.parentElement.querySelector('span');
      span.className = cb.checked ? 'done-text' : '';
    });
  });

  document.getElementById('conclusion-input').addEventListener('input', (e) => { ls.conclusion = e.target.value; saveState(state); });
  document.getElementById('conclusion-reveal-btn').addEventListener('click', () => {
    ls.conclusionRevealed = true; saveState(state);
    document.getElementById('conclusion-model').classList.add('shown');
  });

  document.getElementById('challenge-input').addEventListener('input', (e) => { ls.challengeResponse = e.target.value; saveState(state); });
  document.getElementById('challenge-reveal-btn').addEventListener('click', () => {
    ls.challengeRevealed = true; saveState(state);
    document.getElementById('challenge-model').classList.add('shown');
  });

  document.getElementById('gate-details').addEventListener('toggle', (e) => { ls.gateOpened = e.target.open; saveState(state); });
  document.getElementById('gate-input').addEventListener('input', (e) => { ls.gateResponse = e.target.value; saveState(state); });
  document.getElementById('gate-reveal-btn').addEventListener('click', () => {
    ls.gateRevealed = true; saveState(state);
    document.getElementById('gate-model').classList.add('shown');
  });

  document.getElementById('complete-btn').addEventListener('click', () => {
    ls.complete = !ls.complete; saveState(state);
    pushLabCompletion(lab.lab, ls.complete);
    render();
  });
}

function render() { renderNav(); renderMain(); }

(async function start() {
  render();
  await initSync();
  render();
})();
</script>
</body>
</html>
